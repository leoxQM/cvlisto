@if (cv().config.template !== 'ats') {
  <div class="flex flex-col gap-3 p-4">
  <h2 class="text-lg font-semibold text-gray-700">Foto de Perfil</h2>

  <div class="flex items-center gap-4">

    <!-- Preview de la foto -->
    <div class="w-20 h-20 rounded-full border-2 border-dashed border-gray-300 overflow-hidden flex items-center justify-center bg-gray-50 flex-shrink-0">
      @if (cv().personalInfo.photoUrl) {
        <img [src]="cv().personalInfo.photoUrl" alt="Foto de perfil" class="w-full h-full object-cover" />
      } @else {
        <i class="pi pi-user text-3xl text-gray-300"></i>
      }
    </div>

    <!-- Botones -->
    <div class="flex flex-col gap-2">
      <label
        class="cursor-pointer flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-300 text-sm text-gray-600 hover:bg-gray-50 transition-colors">
        <i class="pi pi-upload text-sm"></i>
        Subir foto
        <input
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onFileSelected($event)" />
      </label>

      @if (cv().personalInfo.photoUrl) {
        <button
          class="flex items-center gap-2 px-3 py-2 rounded-lg border border-red-200 text-sm text-red-500 hover:bg-red-50 transition-colors"
          (click)="removePhoto()">
          <i class="pi pi-trash text-sm"></i>
          Eliminar foto
        </button>
      }
    </div>

  </div>

  <p class="text-xs text-gray-400">La foto se mostrará en los templates que la soporten</p>
</div>
}
