<app-dynamic-list
  title="Experiencia Laboral"
  [items]="cvService.cvData().experience"
  (onAdd)="cvService.addExperience()"
  (onRemove)="onRemove($event)">

  <ng-template let-exp>
    <form [formGroup]="getForm(exp)" class="flex flex-col gap-3 pt-2 pr-8">

      <div class="flex gap-3">
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Cargo</label>
          <input pInputText formControlName="position" placeholder="Ej: Desarrollador Frontend" class="w-full" />
        </div>
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Empresa</label>
          <input pInputText formControlName="company" placeholder="Ej: Google" class="w-full" />
        </div>
      </div>

      <div class="flex gap-3">
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Fecha inicio</label>
          <input pInputText formControlName="startDate" placeholder="Ej: Enero 2022" class="w-full" />
        </div>
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Fecha fin</label>
          <input pInputText formControlName="endDate" placeholder="Ej: Diciembre 2023" class="w-full"
            [class.opacity-50]="getForm(exp).get('isCurrent')?.value"
            [attr.disabled]="getForm(exp).get('isCurrent')?.value ? true : null" />
        </div>
      </div>

      <div class="flex items-center gap-2">
        <p-checkbox formControlName="isCurrent" [binary]="true" inputId="current_{{exp.id}}" />
        <label [for]="'current_' + exp.id" class="text-sm text-gray-600">Trabajo actualmente aquí</label>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm text-gray-600">Responsabilidades</label>
        <textarea
          pTextarea
          formControlName="responsibilities"
          placeholder="Describe tus responsabilidades y logros..."
          rows="3"
          class="w-full resize-none">
        </textarea>
      </div>

    </form>
  </ng-template>

</app-dynamic-list>
