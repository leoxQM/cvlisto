<app-dynamic-list
  title="Idiomas"
  [items]="cvService.cvData().languages"
  (onAdd)="cvService.addLanguage()"
  (onRemove)="onRemove($event)">

  <ng-template let-lang>
    <form [formGroup]="getForm(lang)" class="flex flex-col gap-3 pt-2 pr-8">

      <div class="flex gap-3">
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Idioma</label>
          <input pInputText formControlName="name" placeholder="Ej: Inglés" class="w-full" />
        </div>
        <div class="flex flex-col gap-1 w-1/2">
          <label class="text-sm text-gray-600">Nivel</label>
          <input pInputText formControlName="level" placeholder="Ej: Avanzado" class="w-full" />
        </div>
      </div>

    </form>
  </ng-template>

</app-dynamic-list>
