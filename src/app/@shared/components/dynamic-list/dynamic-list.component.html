<div class="flex flex-col gap-3 p-4">

  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-700">{{ title() }}</h2>
    <p-button
      icon="pi pi-plus"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="onAdd.emit()"
      pTooltip="Agregar"
    />
  </div>

  @for (item of items(); track item.id) {
    <div class="relative border border-gray-200 rounded-lg p-3">

      <div class="absolute top-2 right-2">
        <p-button
          icon="pi pi-trash"
          [rounded]="true"
          [text]="true"
          severity="danger"
          (onClick)="onRemove.emit(item.id)"
          pTooltip="Eliminar"
        />
      </div>

      <ng-container
        *ngTemplateOutlet="itemTemplate; context: { $implicit: item }">
      </ng-container>

    </div>
  }

  @empty {
    <div class="text-sm text-gray-400 text-center py-4 border border-dashed border-gray-200 rounded-lg">
      No hay items agregados. Presiona + para agregar.
    </div>
  }

</div>
